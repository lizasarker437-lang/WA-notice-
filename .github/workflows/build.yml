name: Build WhatsApp Voice Announcer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/wavoiceannouncer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WAVoiceAnnouncer"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.wavoiceannouncer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wavoiceannouncer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="WA ভয়েস অ্যানাউন্সার"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- হোয়াটসঅ্যাপ নোটিফিকেশন লিসেনার সার্ভিস -->
                  <service
                      android:name=".WhatsAppNotificationListener"
                      android:label="WhatsApp Voice Announcer"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/wavoiceannouncer/MainActivity.kt
          package com.example.wavoiceannouncer

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btnPermission = findViewById<Button>(R.id.btnPermission)
                  val btnToggle = findViewById<Button>(R.id.btnToggle)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  btnPermission.setOnClickListener {
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                      Toast.makeText(this, "'WA ভয়েস অ্যানাউন্সার' পারমিশন চালু করুন", Toast.LENGTH_LONG).show()
                  }

                  btnToggle.setOnClickListener {
                      WhatsAppNotificationListener.isAnnouncerActive = !WhatsAppNotificationListener.isAnnouncerActive
                      if (WhatsAppNotificationListener.isAnnouncerActive) {
                          btnToggle.text = "ভয়েস সার্ভিস বন্ধ করুন"
                          btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#EF4444"))
                          tvStatus.text = "স্ট্যাটাস: ভয়েস অ্যানাউন্সার চালু আছে ✅"
                      } else {
                          btnToggle.text = "ভয়েস সার্ভিস চালু করুন"
                          btnToggle.setBackgroundColor(android.graphics.Color.parseColor("#10B981"))
                          tvStatus.text = "স্ট্যাটাস: ভয়েস অ্যানাউন্সার বন্ধ আছে ⏸️"
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)
                  if (WhatsAppNotificationListener.isAnnouncerActive) {
                      tvStatus.text = "স্ট্যাটাস: ভয়েস অ্যানাউন্সার চালু আছে ✅"
                  } else {
                      tvStatus.text = "স্ট্যাটাস: ভয়েস অ্যানাউন্সার বন্ধ আছে ⏸️"
                  }
              }
          }
          EOF

          # 7. WhatsAppNotificationListener.kt (নোটিফিকেশন রিড এবং বাংলায় কথা বলা)
          cat << 'EOF' > app/src/main/java/com/example/wavoiceannouncer/WhatsAppNotificationListener.kt
          package com.example.wavoiceannouncer

          import android.app.Notification
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          class WhatsAppNotificationListener : NotificationListenerService(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var isTtsReady = false
              private var lastSpokenMessage = ""

              companion object {
                  var isAnnouncerActive = true
              }

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("bn", "BD"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.setLanguage(Locale("bn"))
                      }
                      isTtsReady = true
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (!isAnnouncerActive || sbn == null) return

                  val packageName = sbn.packageName
                  // সাধারণ WhatsApp এবং WhatsApp Business ফিল্টারিং
                  if (packageName == "com.whatsapp" || packageName == "com.whatsapp.w4b") {
                      val extras = sbn.notification.extras
                      val title = extras.getString(Notification.EXTRA_TITLE) ?: ""
                      val message = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""

                      // সিস্টেম নোটিফিকেশন, ব্যাকআপ নোটিফিকেশন ও ফাঁকা মেসেজ স্কিপ করা
                      if (message.isEmpty() || title.contains("messages") || title.contains("WhatsApp") || title.contains("Checking for")) return

                      val speechText = "$title পাঠিয়েছেন: $message"

                      // ডুপ্লিকেট অ্যানাউন্সমেন্ট এড়ানো
                      if (speechText != lastSpokenMessage) {
                          lastSpokenMessage = speechText
                          speakOut(speechText)
                      }
                  }
              }

              private fun speakOut(text: String) {
                  if (isTtsReady) {
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "WA_ANNOUNCE_ID")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  tts?.stop()
                  tts?.shutdown()
              }
          }
          EOF

          # 8. Layouts & Drawables
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#0F172A">

              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@android:drawable/stat_notify_chat"
                  android:tint="#10B981"
                  android:layout_marginBottom="20dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="হোয়াটসঅ্যাপ ভয়েস স্পিকার"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="10dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="স্ট্যাটাস: ভয়েস অ্যানাউন্সার চালু আছে ✅"
                  android:textColor="#94A3B8"
                  android:textSize="14sp"
                  android:layout_marginBottom="32dp" />

              <Button
                  android:id="@+id/btnPermission"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="১. নোটিফিকেশন পারমিশন দিন"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#2563EB"
                  android:layout_marginBottom="16dp" />

              <Button
                  android:id="@+id/btnToggle"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="ভয়েস সার্ভিস বন্ধ করুন"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#EF4444" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">WA ভয়েস অ্যানাউন্সার</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Voice-Announcer-APK
          path: app/build/outputs/apk/debug/*.apk
